name: Build SeparateSound APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # continue-on-error: an artifact-upload failure (e.g. account storage
      # quota) must never cancel the job or the release below.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: separatesound-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/SeparateSound-${{ github.ref_name }}.apk"

      - name: Create GitHub Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SeparateSound ${{ github.ref_name }}
          body: |
            SeparateSound v1.0 — per-app audio output routing for rooted
            Android, in the spirit of Samsung's "Separate App Sound".
            Release date: 23 October 2026

            An LSPosed module built on the modern libxposed API (102):
            choose per app whether its audio goes to the connected
            Bluetooth A2DP device or stays on the phone speaker.

            How to use:
            1. Install the APK.
            2. In LSPosed Manager, enable SeparateSound and tick the apps
               you want to control in its scope.
            3. Reboot (or force-stop the target apps once).
            4. Open SeparateSound, turn on the master switch, and set a
               route per app (System / Bluetooth / Speaker).
            5. Force-stop and reopen each target app, then test.

            Requirements: Android 8.1+ and LSPosed (libxposed API 100+).

            Honest limitations: enforcement depends on the ROM's audio
            policy — if the system ignores the requested route, the module
            cannot force it. Apps using native/offloaded audio paths that
            never create a Java AudioTrack/MediaPlayer may not be captured.

            Signed with the repo-pinned separatesound.keystore, so future
            releases update in place.

            ---
            Bahasa Indonesia: modul LSPosed untuk memisahkan keluaran
            suara per aplikasi (Bluetooth / speaker HP) ala Separate App
            Sound Samsung. Aktifkan modul + scope di LSPosed, atur rute di
            aplikasi, paksa berhenti lalu buka lagi aplikasi target.
          files: ${{ github.workspace }}/SeparateSound-${{ github.ref_name }}.apk
